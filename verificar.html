<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificação do site · Português Banana</title>
<style>
:root{--bg:#F3EEE4;--ink:#141B2E;--soft:#5B6274;--card:#FFFDF8;--line:#E7DFD0;--ok:#1E7A4F;--no:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--ink:#EEF0F6;--soft:#A5ADC0;--card:#141B2E;--line:#222C45;--ok:#5FD39A;--no:#FF8A80;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 18px 60px}
h1{font:600 1.7rem/1.15 Georgia,serif;margin:0 0 6px}
.sub{color:var(--soft);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.st{flex:none;font-weight:800;width:22px}
.ok .st{color:var(--ok)}.no .st{color:var(--no)}
.det{color:var(--soft);font-size:.85rem;word-break:break-all}
.big{font-size:1.15rem;font-weight:700;margin:0}
.big.ok{color:var(--ok)}.big.no{color:var(--no)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Verificação do site</h1>
<p class="sub">Esta página confere, direto do GitHub, se tudo que o PWABuilder precisa está publicado corretamente.</p>
<div class="card" id="resumo"><p class="big">Verificando…</p></div>
<div class="card" id="lista"></div>
<p><button onclick="location.reload()">Verificar de novo</button></p>
</main>
<script>
const ESPERADA="1.1.2";
const lista=document.getElementById("lista"),resumo=document.getElementById("resumo");
let falhas=0;
function linha(ok,titulo,detalhe){if(!ok)falhas++;const d=document.createElement("div");d.className="row "+(ok?"ok":"no");d.innerHTML=`<span class="st">${ok?"✓":"✗"}</span><div><b>${titulo}</b><div class="det">${detalhe||""}</div></div>`;lista.appendChild(d);}
async function semCache(u){return fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});}
async function imagem(u){const r=await semCache(u);const b=await r.blob();let dim="—";try{const im=await createImageBitmap(b);dim=im.width+"x"+im.height;}catch(e){}return {status:r.status,tipo:b.type,dim};}
(async()=>{
  try{
    const base=new URL(".",location.href).href;
    const html=await (await semCache(base+"index.html")).text();
    const doc=new DOMParser().parseFromString(html,"text/html");
    const ver=(doc.querySelector('meta[name="pb-version"]')||{}).content||"antiga";
    linha(ver===ESPERADA,"Versão do jogo publicada: "+ver,ver===ESPERADA?"É a versão nova.":"O GitHub ainda está mostrando uma versão antiga. Confira o envio e espere o ✓ verde na aba Actions.");
    const mlink=doc.querySelector('link[rel="manifest"]');
    if(!mlink){linha(false,"Link do manifesto","O index.html publicado não aponta para nenhum manifesto.");throw 0;}
    const murl=new URL(mlink.getAttribute("href"),base).href;
    const mr=await semCache(murl);let m=null;try{m=await mr.json();}catch(e){}
    linha(mr.status===200&&!!m,"Manifesto: "+mlink.getAttribute("href"),mr.status===200&&m?`Nome: ${m.name}`:`Não foi possível ler (código ${mr.status}).`);
    if(!m)throw 0;
    for(const x of [...(m.icons||[]),...(m.screenshots||[])]){
      const u=new URL(x.src,murl).href;const r=await imagem(u);
      const ok=r.status===200&&r.tipo==="image/png"&&r.dim===x.sizes;
      linha(ok,(x.form_factor?"Captura ":"Ícone ")+x.src,ok?`PNG ${r.dim}, como declarado.`:`Código ${r.status} · tipo ${r.tipo||"—"} · tamanho ${r.dim} (esperado ${x.sizes}).`);
    }
    const sw=await semCache(base+"sw.js");linha(sw.status===200,"Service worker (sw.js)",sw.status===200?"Encontrado.":"Não encontrado.");
  }catch(e){if(e!==0)linha(false,"Erro ao verificar",String(e));}
  resumo.innerHTML=falhas?`<p class="big no">✗ Ainda há ${falhas} problema(s)</p><p class="det">Veja a lista abaixo. Se a versão publicada for antiga, espere alguns minutos e toque em “Verificar de novo”.</p>`:`<p class="big ok">✓ Tudo certo</p><p class="det">Pode voltar ao PWABuilder e analisar o endereço de novo.</p>`;
})();
</script>
</body>
</html>
